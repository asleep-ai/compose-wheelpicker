[versions]
# AGP 9 brings its own kotlin-gradle-plugin (9.1.0 → KGP 2.2.10) for built-in Kotlin, so an AGP
# bump can move the Kotlin compiler even if `kotlin` below is unchanged. Run consumer-check after
# bumping AGP too.
agp = "9.1.0"
coreKtx = "1.10.1"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
lifecycleRuntimeKtx = "2.6.1"
activityCompose = "1.8.0"
# Ceiling while consumers are on Kotlin 1.9: wheelpicker builds with languageVersion/apiVersion 1.9
# (deprecated K1 mode, see wheelpicker/build.gradle.kts). Only move to a compiler that still accepts
# languageVersion 1.9, or raise the consumer floor first. Run consumer-check after any change.
kotlin = "2.2.10"
# Floor for consumers: Compose 1.7.0 / material3 1.3.0 (Kotlin 1.9 + Compose compiler 1.5.x apps).
# :wheelpicker pins these directly instead of importing a BOM, because a BOM in the published POM
# would also constrain Compose artifacts the library doesn't use (e.g. material-icons-core).
# Do not raise without checking consumer-check; these versions end up in the published POM.
composeFloor = "1.7.0"
material3Floor = "1.3.0"
# Same floor as a BOM (Compose 1.7.0 / material3 1.3.0) for :sample-floor.
composeBom = "2024.09.00"
# Latest Compose for :sample only (not published), so the library is also exercised on current Compose.
composeBomLatest = "2026.02.01"
mavenPublish = "0.29.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-bom-latest = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBomLatest" }
floor-compose-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "composeFloor" }
floor-compose-foundation = { group = "androidx.compose.foundation", name = "foundation", version.ref = "composeFloor" }
floor-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling", version.ref = "composeFloor" }
floor-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview", version.ref = "composeFloor" }
floor-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4", version.ref = "composeFloor" }
floor-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest", version.ref = "composeFloor" }
androidx-test-runner = { group = "androidx.test", name = "runner", version = "1.5.2" }
floor-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3Floor" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }

