plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def wheelpickerVersion = providers.gradleProperty('wheelpickerVersion').getOrElse('0.0.0-consumer-check')

android {
    namespace 'ai.asleep.compose.wheelpicker.consumercheck'
    compileSdk 35

    defaultConfig {
        applicationId 'ai.asleep.compose.wheelpicker.consumercheck'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion = '1.5.14'
    }
}

dependencies {
    implementation "ai.asleep:compose-wheelpicker:${wheelpickerVersion}"
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.compose.ui:ui:1.7.2'
    implementation 'androidx.compose.material3:material3:1.3.0'

    // Interaction tests on a minSdk (API 26) device: connectedDebugAndroidTest
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4:1.7.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    debugImplementation 'androidx.compose.ui:ui-test-manifest:1.7.2'
}

// The library must not drag the app above its own Kotlin/Compose versions.
tasks.register('verifyResolvedVersions') {
    def classpath = configurations.named('releaseRuntimeClasspath')
    doLast {
        def versions = classpath.get().incoming.resolutionResult.allComponents
            .collect { it.moduleVersion }
            .findAll { it != null }
            .collectEntries { ["${it.group}:${it.name}".toString(), it.version] }
        def expected = [
            'org.jetbrains.kotlin:kotlin-stdlib'      : '1.9.24',
            'androidx.compose.ui:ui'                  : '1.7.2',
            'androidx.compose.foundation:foundation'  : '1.7.2',
            'androidx.compose.material3:material3'    : '1.3.0',
        ]
        def failures = expected.findAll { module, version -> versions[module] != version }
            .collect { module, version -> "${module}: expected ${version}, resolved ${versions[module]}" }
        if (!failures.isEmpty()) {
            throw new GradleException("compose-wheelpicker raised consumer versions:\n" + failures.join('\n'))
        }
        println "Resolved versions OK: " + expected.keySet().collect { "${it}=${versions[it]}" }.join(', ')
    }
}
