plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def wheelpickerVersion = providers.gradleProperty('wheelpickerVersion').getOrElse('0.0.0-consumer-check')

android {
    namespace 'ai.asleep.compose.wheelpicker.consumercheck'
    compileSdk 35

    defaultConfig {
        applicationId 'ai.asleep.compose.wheelpicker.consumercheck'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion = '1.5.14'
    }
}

dependencies {
    implementation "ai.asleep:compose-wheelpicker:${wheelpickerVersion}"
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.compose.ui:ui:1.7.2'
    implementation 'androidx.compose.material3:material3:1.3.0'

    // Interaction tests on a minSdk (API 26) device: connectedDebugAndroidTest
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4:1.7.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    debugImplementation 'androidx.compose.ui:ui-test-manifest:1.7.2'
}

// The library must not drag the app above its own versions. Resolve the release runtime
// classpath with and without compose-wheelpicker and fail if any module the app already has
// resolves to a different version (stdlib, Compose, and transitive ones like lifecycle or coroutines).
tasks.register('verifyResolvedVersions') {
    def withLibrary = configurations.named('releaseRuntimeClasspath')
    def withoutLibrary = providers.provider {
        configurations.releaseRuntimeClasspath.copyRecursive { dep -> dep.group != 'ai.asleep' }
    }
    doLast {
        def versionsOf = { conf ->
            conf.incoming.resolutionResult.allComponents
                .collect { it.moduleVersion }
                .findAll { it != null && it.group != 'ai.asleep' }
                .collectEntries { ["${it.group}:${it.name}".toString(), it.version] }
        }
        def baseline = versionsOf(withoutLibrary.get())
        def actual = versionsOf(withLibrary.get())
        if (baseline.isEmpty() || !baseline.containsKey('androidx.compose.ui:ui')) {
            throw new GradleException("Baseline classpath looks wrong: ${baseline.keySet()}")
        }
        def changed = baseline.findAll { module, version -> actual[module] != version }
            .collect { module, version -> "${module}: app ${version}, with library ${actual[module]}" }
        def added = actual.keySet() - baseline.keySet()
        if (!changed.isEmpty()) {
            throw new GradleException("compose-wheelpicker changed the app's dependency versions:\n" + changed.join('\n'))
        }
        // KGP adds kotlin-stdlib lazily, so the baseline copy may miss it; check it explicitly.
        def expected = [
            'org.jetbrains.kotlin:kotlin-stdlib'    : '1.9.24',
            'androidx.compose.ui:ui'                : '1.7.2',
            'androidx.compose.foundation:foundation': '1.7.2',
            'androidx.compose.material3:material3'  : '1.3.0',
        ]
        def wrong = expected.findAll { module, version -> actual[module] != version }
            .collect { module, version -> "${module}: expected ${version}, resolved ${actual[module]}" }
        if (!wrong.isEmpty()) {
            throw new GradleException("compose-wheelpicker raised consumer versions:\n" + wrong.join('\n'))
        }
        println "Resolved versions OK: ${baseline.size()} modules unchanged" +
            (added ? ", added by the library: ${added.sort().join(', ')}" : '')
        expected.keySet().each { println "  ${it}=${actual[it]}" }
    }
}
